services:
  # Next.js Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whispering-palms-web
    restart: always
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - ANYTHINGLLM_API_URL=http://anythingllm:3001
    depends_on:
      - anythingllm
    networks:
      - app-network

  # AnythingLLM for RAG and AI Orchestration
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    restart: always
    ports:
      # Host port is configurable: 3001 is commonly taken by the AnythingLLM
      # desktop app. Override with ANYTHINGLLM_HOST_PORT in .env.local.
      - "${ANYTHINGLLM_HOST_PORT:-3101}:3001"
    volumes:
      - ./anythingllm/storage:/app/server/storage
    environment:
      - STORAGE_DIR=/app/server/storage
      - VECTOR_DB=qdrant
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    networks:
      - app-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      # 6333/6334 are often already in use by another Qdrant instance.
      - "${QDRANT_HOST_PORT:-6433}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6434}:6334"
    volumes:
      - ./anythingllm/qdrant_storage:/qdrant/storage
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
